name: ConPTY Teardown Oracle

# Transport reality #3: TEARDOWN / lifecycle. A raw-pipe transport has no
# ConPTY job object stealing the child's job slot, so wintty can own a job
# with KILL_ON_JOB_CLOSE and get POSIX-equivalent tree kill. This job proves
# that closing the job handle kills the child AND a grandchild (no leak) and
# that the reader then hits EOF (no wedge), and contrasts it with ConPTY,
# where AssignProcessToJobObject is expected to fail (child already in
# ConPTY's job). Research branch only.
on:
  push:
    branches: [transport/raw-pipe-realities]
  workflow_dispatch: {}

jobs:
  teardown:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Windows version
        shell: cmd
        run: ver

      - name: Build oracle
        shell: cmd
        run: |
          cd tools\conpty-oracle
          zig build -Dtarget=x86_64-windows-gnu

      - name: Compile tree child
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path teardown-bin | Out-Null
          zig cc -target x86_64-windows-gnu -o teardown-bin/tree_child.exe differential-corpus/lifecycle/tree_child.c
          if ($LASTEXITCODE -ne 0) { "FAIL: tree_child.c did not compile"; exit 1 }
          "compiled tree_child.exe"

      - name: Teardown probe (job KILL_ON_JOB_CLOSE tree kill)
        shell: pwsh
        env:
          CONPTY_ORACLE_WATCHDOG_MS: "8000"
        run: |
          $oracle = "tools/conpty-oracle/zig-out/bin/conpty-oracle.exe"
          $child  = "teardown-bin/tree_child.exe"
          "==== teardown probe ===="
          $log = & $oracle teardown-probe $child 2>&1 | Out-String
          $rc = $LASTEXITCODE
          ($log.Trim() -split "`n") -join "`n"
          ""
          # A failed tree kill / leak / wedge is a real negative result worth
          # a red run; harness errors also exit non-zero from the oracle.
          if ($rc -ne 0) { "RESULT: teardown probe did not fully pass (rc=$rc)"; exit 1 }
          "RESULT: raw-pipe job-object teardown is POSIX-equivalent (tree kill, no leak, no wedge)"
