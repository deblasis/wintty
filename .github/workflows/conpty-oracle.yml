name: ConPTY Oracle

# Differential cell-identity oracle: build the harness, compile the
# corpus, and run `selfcheck` (same program under ConPTY twice -> assert
# the ghostty-vt cell dump is byte-identical). This is the P0.2 milestone:
# prove the capture->parse->dump pipeline is sound and triage which corpus
# programs are deterministic under ConPTY-vs-ConPTY. Scratch branch only.
on:
  push:
    branches: [oracle/differential-cell-identity]
  workflow_dispatch: {}

jobs:
  oracle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Windows version
        shell: cmd
        run: ver

      - name: Build oracle
        shell: cmd
        run: |
          cd tools\conpty-oracle
          rem gnu ABI (matches the corpus compile) + simd=false to avoid the
          rem simdutf/highway C++ deps that fail under the runner's MSVC toolchain.
          zig build -Dtarget=x86_64-windows-gnu

      - name: Compile corpus programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path corpus-bin | Out-Null
          $ok = 0; $fail = 0; $failed = @()
          Get-ChildItem differential-corpus/programs/*.c | ForEach-Object {
            $name = $_.BaseName
            $out = "corpus-bin/$name.exe"
            # mingw ABI matches the oracle; <windows.h> resolves from zig's
            # bundled headers. Tolerate per-file compile failures.
            zig cc -target x86_64-windows-gnu -o $out $_.FullName 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path $out)) { $ok++ }
            else { $fail++; $failed += $name }
          }
          "compiled OK: $ok   failed: $fail"
          if ($failed.Count) { "did not compile: $($failed -join ', ')" }

      - name: Sanity dump (guard against false-pass on empty captures)
        shell: pwsh
        run: |
          $oracle = "tools/conpty-oracle/zig-out/bin/conpty-oracle.exe"
          $exe = "corpus-bin/test_cell_grid.exe"
          $d = & $oracle dump $exe 120 30 | Out-String
          "--- test_cell_grid dump (first 25 lines) ---"
          ($d -split "`n" | Select-Object -First 25) -join "`n"
          "--- dump length: $($d.Length) bytes ---"
          # A populated 120x30 grid dump is well over 200 bytes; a near-empty
          # capture (pcon's 0-byte bug) would trip this and fail the run.
          if ($d.Length -lt 200) {
            "FAIL: dump is trivially small - capture is likely broken (0-byte trap)"
            exit 1
          }

      - name: Selfcheck (ConPTY determinism triage)
        shell: pwsh
        env:
          # Bound input-reading programs so they don't burn the default 60s.
          CONPTY_ORACLE_WATCHDOG_MS: "8000"
        run: |
          $oracle = "tools/conpty-oracle/zig-out/bin/conpty-oracle.exe"
          # Known-noisy: these print per-run values (PID / raw HANDLE), so
          # they differ run-to-run through no fault of the transport. See
          # differential-corpus/README.md "Noise-floor finding". Non-
          # determinism OUTSIDE this list is a real regression.
          $noisy = @("test_console_api", "test_setstdhandle")
          $det = @(); $nondet = @(); $noisyhit = @(); $err = @()
          Get-ChildItem corpus-bin/*.exe | ForEach-Object {
            $name = $_.BaseName
            $log = & $oracle selfcheck $_.FullName 120 30 2>&1 | Out-String
            switch ($LASTEXITCODE) {
              0 { $det += $name;    "  OK    $name" }
              1 {
                if ($noisy -contains $name) { $noisyhit += $name; "  NOISY $name (expected: prints PID/handle)" }
                else {
                  $nondet += $name; "  DIFF  $name  <-- UNEXPECTED"
                  "  ---- $name run1 vs run2 (first 40 diff lines) ----"
                  ($log.Trim() -split "`n" | Select-Object -First 40) -join "`n"
                  "  ---- end $name ----"
                }
              }
              default { $err += $name; "  ERR   $name (exit $LASTEXITCODE)"; $log.Trim() }
            }
          }
          ""
          "==== selfcheck summary ===="
          "deterministic         : $($det.Count)"
          "known-noisy (expected): $($noisyhit.Count)  [$($noisyhit -join ', ')]"
          "UNEXPECTED non-det    : $($nondet.Count)  [$($nondet -join ', ')]"
          "harness error         : $($err.Count)  [$($err -join ', ')]"
          ""
          if ($det.Count -eq 0) {
            "FAIL: no program was deterministic - harness/capture/dump pipeline is broken"
            exit 1
          }
          if ($nondet.Count -gt 0) {
            "FAIL: $($nondet.Count) program(s) non-deterministic outside the known-noisy list - ConPTY determinism regression or new self-noise to characterize"
            exit 1
          }
          if ($err.Count -gt 0) {
            "FAIL: $($err.Count) harness error(s)"
            exit 1
          }
          "PASS: ConPTY deterministic across $($det.Count) programs (+$($noisyhit.Count) known-noisy); oracle pipeline sound"
