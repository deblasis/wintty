name: ConPTY Read Probe

# Scratch measurement workflow: quantifies ConPTY read-path behavior on a
# real Windows machine before porting upstream's io-gather thread
# (ghostty-org/ghostty#13209) to the Windows transport. Lives only on the
# probe/conpty-read branch; delete branch + workflow when done.
on:
  push:
    branches: [probe/conpty-read]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Windows version
        shell: cmd
        run: ver

      - name: Build probe
        shell: cmd
        run: zig build-exe probe\conpty_probe.zig -O ReleaseFast

      # Same pair the app bundles (windows/Ghostty/Ghostty.csproj pin).
      # Placed next to the probe exe so it resolves them exactly like
      # pty.zig resolvePseudoConsoleApi does in production.
      - name: Fetch bundled ConPTY pair (pinned version)
        shell: pwsh
        run: |
          $ver = "1.25.260427001-preview"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/$ver/microsoft.windows.console.conpty.$ver.nupkg"
          curl.exe -sSL -o conpty-pkg.zip $url
          Expand-Archive conpty-pkg.zip -DestinationPath conpty-pkg
          Copy-Item conpty-pkg/runtimes/win-x64/native/conpty.dll .
          Copy-Item conpty-pkg/build/native/runtimes/x64/OpenConsole.exe .
          # Dump exact file/product versions so we can confirm whether this
          # build postdates microsoft/terminal#17510 (VtEngine removal).
          Get-Item conpty.dll, OpenConsole.exe | ForEach-Object {
            "{0}  len={1}  file={2}  product={3}" -f `
              $_.Name, $_.Length, $_.VersionInfo.FileVersion, $_.VersionInfo.ProductVersion
          }
          $ch = (Get-Item "$env:SystemRoot\System32\conhost.exe").VersionInfo
          "in-box conhost.exe  file={0}" -f $ch.FileVersion
          $ib = "$env:SystemRoot\System32\OpenConsole.exe"
          if (Test-Path $ib) {
            $vi = (Get-Item $ib).VersionInfo
            "in-box OpenConsole.exe  file={0}  product={1}" -f $vi.FileVersion, $vi.ProductVersion
          } else { "in-box OpenConsole.exe  (absent)" }

      - name: Run probe
        shell: cmd
        run: conpty_probe.exe 2>&1
